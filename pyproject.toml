[project]
name = "cnmodel"
version = "0.60.0"
description = "CNModel - a computational framework for modeling and simulating neurons and networks in the auditory system"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Paul B. Manis", email = "pbmanis@med.unc.edu" },
    { name = "Luke Campagnola", email = "lukecampagnola@gmail.com" }
]
dependencies = [
    # "cython==0.29.36",
    "jupyterlab>=4.4.6",
    "lmfit>=1.3.0",
    "matplotlib>=3.10.0",
    "matplotlib-scalebar>=0.8.1",
    "neuron>=9.0",
    "numba>=0.63.0",
    "numpy>=2.2.6",
    "pint>=0.14",
    "pyqt6>=6.9.1",
    "pyqt6-sip>=13.10.2",
    "pyqtgraph>=0.13.7",
    "pytest>=6",
    "pyzbc2014",
    "resampy>=0.4",
    "scipy>=1.15.3",
    "sounddevice==0.4.4",
]

[project.scripts]
cnmodel_examples = "examples.examples_gui:main"

[build-system]
requires = ["setuptools>=70", "hatchling", "wheel"]
build-backend = "hatchling.build" #"setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cnmodel*"] # Include your main package
exclude = ["docs*", "gif*", "cochlea*", "examples*"] # Exclude specific directories

[tool.hatch.build.targets.sdist]
include = [
    "cnmodel*", 
    "cnmodel/mechanisms/*.mod",
    "cnmodel/mechanisms/x86_64/*.so",
    "cnmodel/mechanisms/arm64/*.so",
    "cnmodel/mechanisms/x86_64/*.dylib",
    "cnmodel/mechanisms/arm64/*.dylib",
    "cnmodel/mechanisms/x86_64/*.dll",
    "cnmodel/mechanisms/arm64/*.dll",
    "cnmodel/mechanisms/x86_64/*.mod",
    "cnmodel/mechanisms/arm64/*.mod"
]
exclude = [
    "docs/*",
    "gif/*",
    "cochlea/*",
    "examples/*"
]

[tool.hatch.build.targets.wheel]
packages = ["cnmodel", "examples"]
artifacts = [
    '*.so',
    '*.dylib',
    '*.dll',
    '*.mod'
]
# [tool.setuptools.package-data]
# cnmodel = ["*.dylib", "*.so", "*.dll", "*.mod"]

[tool.uv.sources]
# Build pyzbc2014 from the adjacent sibling checkout for the current platform,
# rather than pinning a prebuilt, platform-specific wheel (breaks cross-platform).
pyzbc2014 = { path = "../PyZBC2014", editable = true }
